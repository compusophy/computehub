[workspace]
resolver = "3"
members = [
    "crates/fuel",
    "crates/cap",
    "crates/lang",
    "crates/wasmgen",
    "crates/applang-syntax",
    "crates/applang",
    "crates/wm",
    "crates/gfx",
    "crates/host",
    "crates/shell",
    "crates/platform",
    "crates/os",
    "crates/font",
    "crates/vfs",
    "crates/text",
    "crates/ui",
    "crates/guest",
    "crates/apps",
    "crates/studio",
    "crates/vt",
    "crates/term",
    "tools/serve",
]
# The native node takes PTY and WebSocket libraries, so it is its own
# workspace with its own lockfile, outside the zero-dependency graph.
exclude = ["node"]

# Every crate inherits these. The version lives here, once.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["compusophy"]
repository = "https://github.com/compusophy/computehub"

# Internal deps, declared once. Package names carry the `compusophy-` prefix so
# they can be published; each crate's [lib] name is the short one code uses
# (`fuel::Fuel`, `lang::Diag`, `wm::Wm`).
[workspace.dependencies]
compusophy-fuel = { path = "crates/fuel", version = "0.1.0" }
compusophy-cap = { path = "crates/cap", version = "0.1.0" }
compusophy-lang = { path = "crates/lang", version = "0.1.0" }
compusophy-wasmgen = { path = "crates/wasmgen", version = "0.1.0" }
compusophy-applang-syntax = { path = "crates/applang-syntax", version = "0.1.0" }
compusophy-applang = { path = "crates/applang", version = "0.1.0" }
compusophy-wm = { path = "crates/wm", version = "0.1.0" }
compusophy-gfx = { path = "crates/gfx", version = "0.1.0" }
compusophy-host = { path = "crates/host", version = "0.1.0" }
compusophy-shell = { path = "crates/shell", version = "0.1.0" }
compusophy-platform = { path = "crates/platform", version = "0.1.0" }
compusophy-font = { path = "crates/font", version = "0.1.0" }
compusophy-vfs = { path = "crates/vfs", version = "0.1.0" }
compusophy-text = { path = "crates/text", version = "0.1.0" }
compusophy-ui = { path = "crates/ui", version = "0.1.0" }
compusophy-guest = { path = "crates/guest", version = "0.1.0" }
compusophy-apps = { path = "crates/apps", version = "0.1.0" }
compusophy-studio = { path = "crates/studio", version = "0.1.0" }
compusophy-vt = { path = "crates/vt", version = "0.1.0" }
compusophy-term = { path = "crates/term", version = "0.1.0" }

# The browser boundary. Only `platform` and `os` may use these (scripts/caps.sh).
# wasm-bindgen is pinned to the exact version of the wasm-bindgen CLI that
# scripts/build-web.sh runs; the two must match byte for byte.
wasm-bindgen = "=0.2.121"
js-sys = "0.3"
web-sys = "0.3"

# Ultra lite: every shipped byte is budgeted.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
