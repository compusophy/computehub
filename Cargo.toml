[workspace]
resolver = "3"
members = [
    # The OS: what boots, the kernel and the program worker.
    "crates/wm",
    "crates/gfx",
    "crates/host",
    "crates/home",
    "crates/logon",
    "crates/profiles",
    "crates/shell",
    "crates/platform",
    "crates/os",
    "crates/font",
    "crates/vfs",
    "crates/text",
    "crates/icons",
    "crates/ui",
    "crates/apps",
    "crates/kernel",
    "crates/wasi",
    "crates/cpu",
    "crates/uiwire",
    "crates/uiview",
    "crates/canvas",
    # Programs: what runs in the OS, and the app language they share.
    "programs/fuel",
    "programs/lang",
    "programs/applang-syntax",
    "programs/applang",
    "programs/coder",
    "programs/studio",
    "programs/assistant",
    "programs/chats",
    "programs/files",
    "programs/system",
    "programs/activity",
    "programs/sh",
    "programs/agent",
    "programs/vt",
    "programs/term",
    "programs/terminal",
    "programs/toolbox",
    "tools/serve",
]

# Every crate inherits these. The version lives here, once.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["compusophy"]
repository = "https://github.com/compusophy/computehub"

# Internal deps, declared once. Package names carry the `compusophy-` prefix so
# they can be published; each crate's [lib] name is the short one code uses
# (`fuel::Fuel`, `lang::Diag`, `wm::Wm`).
[workspace.dependencies]
compusophy-wm = { path = "crates/wm", version = "0.1.0" }
compusophy-gfx = { path = "crates/gfx", version = "0.1.0" }
compusophy-host = { path = "crates/host", version = "0.1.0" }
compusophy-home = { path = "crates/home", version = "0.1.0" }
compusophy-logon = { path = "crates/logon", version = "0.1.0" }
compusophy-profiles = { path = "crates/profiles", version = "0.1.0" }
compusophy-shell = { path = "crates/shell", version = "0.1.0" }
compusophy-platform = { path = "crates/platform", version = "0.1.0" }
compusophy-font = { path = "crates/font", version = "0.1.0" }
compusophy-vfs = { path = "crates/vfs", version = "0.1.0" }
compusophy-text = { path = "crates/text", version = "0.1.0" }
compusophy-icons = { path = "crates/icons", version = "0.1.0" }
compusophy-ui = { path = "crates/ui", version = "0.1.0" }
compusophy-apps = { path = "crates/apps", version = "0.1.0" }
compusophy-vt = { path = "programs/vt", version = "0.1.0" }
compusophy-term = { path = "programs/term", version = "0.1.0" }
compusophy-terminal = { path = "programs/terminal", version = "0.1.0" }
compusophy-kernel = { path = "crates/kernel", version = "0.1.0" }
compusophy-wasi = { path = "crates/wasi", version = "0.1.0" }
compusophy-uiwire = { path = "crates/uiwire", version = "0.1.0" }
compusophy-uiview = { path = "crates/uiview", version = "0.1.0" }
compusophy-canvas = { path = "crates/canvas", version = "0.1.0" }
compusophy-fuel = { path = "programs/fuel", version = "0.1.0" }
compusophy-lang = { path = "programs/lang", version = "0.1.0" }
compusophy-applang-syntax = { path = "programs/applang-syntax", version = "0.1.0" }
compusophy-applang = { path = "programs/applang", version = "0.1.0" }
compusophy-coder = { path = "programs/coder", version = "0.1.0" }
compusophy-studio = { path = "programs/studio", version = "0.1.0" }
compusophy-assistant = { path = "programs/assistant", version = "0.1.0" }
compusophy-chats = { path = "programs/chats", version = "0.1.0" }
compusophy-files = { path = "programs/files", version = "0.1.0" }
compusophy-system = { path = "programs/system", version = "0.1.0" }
compusophy-activity = { path = "programs/activity", version = "0.1.0" }
compusophy-sh = { path = "programs/sh", version = "0.1.0" }

# The browser boundary. Only `platform`, `os` and `cpu` may use these
# (scripts/caps.sh).
# wasm-bindgen is pinned to the exact version of the wasm-bindgen CLI that
# scripts/build-web.sh runs; the two must match byte for byte.
wasm-bindgen = "=0.2.121"
js-sys = "0.3"
web-sys = "0.3"

# Ultra lite: every shipped byte is budgeted.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
