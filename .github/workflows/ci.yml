name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the compiler the boot size is measured with locally (as
      # binaryen is below), so CI checks the very wasm the budget was measured
      # on: a new stable reorders and resizes it. Move both on purpose.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown, wasm32-wasip1
          components: clippy, rustfmt
      # The gates fail (dependencies, privacy, unsafe, determinism, licenses);
      # sizes are gauges, printed and never failed on.
      - name: constitution gates, size gauges
        run: bash scripts/caps.sh
      - name: server functions parse
        run: for f in api/*.mjs; do node --check "$f"; done
      - name: format
        run: cargo fmt --all --check
      - name: test
        run: cargo test --workspace
      - name: wasm32 stays green
        run: cargo check --workspace --target wasm32-unknown-unknown
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: docs build without warnings
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The CLI must match the wasm-bindgen version in Cargo.lock exactly;
      # build-web.sh checks and fails loudly otherwise.
      - name: install the wasm-bindgen CLI (the locked version)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.121
      # Without wasm-opt the gauge would measure the unoptimized module, far
      # past the boot's aim. Pinned to binaryen 112, the version the boot size
      # is measured with locally.
      - name: install wasm-opt (binaryen 112)
        run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_112/binaryen-version_112-x86_64-linux.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_112/bin" >> "$GITHUB_PATH"
      - name: web build
        run: bash scripts/build-web.sh
      - name: size gauge
        run: bash scripts/budget.sh
      - name: keep the build for the deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  # The oldest compiler the manifests promise (rust-version in Cargo.toml).
  # Clippy on stable does not catch newer language features, such as let
  # chains, so build and test on this one too.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - name: test on the declared MSRV
        run: cargo test --workspace

  # Each push to main goes to production once every check passed, so prod is
  # main whoever pushed it (this PC, a cloud session), and nobody's branch can
  # replace it (scripts/deploy.sh deploys prod only from main's tip). Needs the
  # repository secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID;
  # without them it says so and deploys nothing.
  deploy:
    needs: [check, msrv]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::No VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_PROJECT_ID secret: nothing deployed."
            exit 0
          fi
          npm install -g vercel@58.9.1
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s","projectName":"computehub"}\n' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          BUILT=1 bash scripts/deploy.sh prod
