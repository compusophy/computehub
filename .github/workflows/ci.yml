name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - name: constitution caps
        run: bash scripts/caps.sh
      - name: format
        run: cargo fmt --all --check
      - name: test
        run: cargo test --workspace
      - name: wasm32 stays green
        run: cargo check --workspace --target wasm32-unknown-unknown
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: docs build without warnings
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The CLI must match the wasm-bindgen version in Cargo.lock exactly;
      # build-web.sh checks and fails loudly otherwise.
      - name: install the wasm-bindgen CLI (the locked version)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.121
      # Without wasm-opt the budget would measure the unoptimized module,
      # which is over the boot cap. Pinned to binaryen 112, the version the
      # boot size is measured with locally.
      - name: install wasm-opt (binaryen 112)
        run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_112/binaryen-version_112-x86_64-linux.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_112/bin" >> "$GITHUB_PATH"
      - name: web build
        run: bash scripts/build-web.sh
      - name: size budget
        run: bash scripts/budget.sh

  # The oldest compiler the manifests promise (rust-version in Cargo.toml).
  # Clippy on stable does not catch newer language features, such as let
  # chains, so build and test on this one too.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - name: test on the declared MSRV
        run: cargo test --workspace
