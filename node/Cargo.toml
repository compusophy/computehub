[package]
name = "computehub-node"
description = "The computehub node: serves real shells on this machine to compusophyOS terminals over an authenticated local WebSocket."
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["compusophy"]
repository = "https://github.com/compusophy/computehub"
publish = false

# Its own workspace: the node is native infrastructure, not part of the
# zero-dependency browser graph. See README.md.
[workspace]

# Kept minimal and pinned to a minor. No async runtime: std threads.
[dependencies]
# ConPTY on Windows, openpty on Unix.
portable-pty = { version = "0.9", default-features = false }
# Synchronous WebSocket server; `handshake` is the only feature we need.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# The pairing token.
getrandom = { version = "0.4", default-features = false }

[lints.rust]
unsafe_code = "forbid"
