[package]
name = "compusophy-platform"
description = "The compusophyOS browser boundary: canvas, WebGL2 renderer for gfx draw lists, input and text events, fetch and on-demand frame scheduling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "platform"

[dependencies]
compusophy-gfx.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "AbortController",
    "AbortSignal",
    "AddEventListenerOptions",
    "CompositionEvent",
    "CssStyleDeclaration",
    "console",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlTextAreaElement",
    "InputEvent",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MouseEvent",
    "Node",
    "Performance",
    "PointerEvent",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "RequestInit",
    "Response",
    "Storage",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlContextAttributes",
    "WebGlPowerPreference",
    "WebGlProgram",
    "WebGlShader",
    "WebGlTexture",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
    "WheelEvent",
    "Window",
    "Worker",
    "WorkerOptions",
    "WorkerType",
] }
